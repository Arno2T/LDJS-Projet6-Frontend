name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read


env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      actions: read
      checks: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      
      - name: Détecter le type de projet
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "type=node" >> "$GITHUB_OUTPUT"
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "type=python" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Aucun package.json, pyproject.toml ou requirements.txt trouvé"
            exit 1
          fi
      - name: Installer Node.js
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      
      - name: Installer Python
        if: steps.detect.outputs.type == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      
      - name: Installer les dépendances Python
        if: steps.detect.outputs.type == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      
      - name: Lancer les tests
        run: ./run-tests.sh

      - name: Sauvegarder les rapports de tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Publier le rapport de tests
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Rapport de tests (${{ steps.detect.outputs.type }})
          path: test-results/junit.xml
          reporter: ${{ steps.detect.outputs.type == 'node' && 'jest-junit' || 'python-xunit' }}