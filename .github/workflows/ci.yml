name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read


env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:
  test:
    name: Tests unitaires
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      
      - name: Détecter le type de projet
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "type=node" >> "$GITHUB_OUTPUT"
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "type=python" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Aucun package.json, pyproject.toml ou requirements.txt trouvé"
            exit 1
          fi

      - name: Installer Node.js
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      
      - name: Installer Python
        if: steps.detect.outputs.type == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      
      - name: Installer les dépendances Python
        if: steps.detect.outputs.type == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      
      - name: Lancer les tests
        run: ./run-tests.sh

      - name: Sauvegarder les rapports de tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Publier le rapport de tests
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Rapport de tests (${{ steps.detect.outputs.type }})
          path: test-results/junit.xml
          reporter: ${{ steps.detect.outputs.type == 'node' && 'jest-junit' || 'python-xunit' }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, release]
    if: ${{ !failure() && !cancelled() }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Après une release, on construit le commit tagué (package.json à jour)
          ref: ${{ needs.release.outputs.version && format('v{0}', needs.release.outputs.version) || github.sha}}
      
      - name: Activer Buildkit/Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        
      - name: ghcr login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
      
      - name: Build et push de l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  
  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      
      - name: Clean install
        run: npm ci
      
      - name: Semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
           BEFORE=$(git rev-parse HEAD)
           npx semantic-release
           # Si une release a eu lieu, semantic-release a créé le commit chore(release) : HEAD a changé
           if [ "$(git rev-parse HEAD)" != "$BEFORE" ]; then
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Nouvelle version publiée : $VERSION"
           else
            echo "Aucune nouvelle version (pas de commit feat/fix depuis la dernière release)"
           fi
        